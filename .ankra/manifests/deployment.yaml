apiVersion: v1
kind: ServiceAccount
metadata:
  name: vodi-shiper
  labels:
    app.kubernetes.io/name: vodi-shiper
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vodi-shiper
  labels:
    app.kubernetes.io/name: vodi-shiper
  annotations:
    ankra.io/generated: "true"
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: vodi-shiper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vodi-shiper
    spec:
      serviceAccountName: vodi-shiper
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ankra-registry-pull
      containers:
        - name: vodi-shiper
          image: registry.ankra.cloud/org-7012d094-ed88-486d-a050-b5cdd59d5c08/vodi_shiper:${{ ankra.image_tag }}
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ANKRA_RELEASE
              value: "${{ ankra.image_tag }}"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vodi-shiper-env
                  key: DATABASE_URL
                  optional: true
            - name: POSTGRESQL_URL
              valueFrom:
                secretKeyRef:
                  name: vodi-shiper-env
                  key: POSTGRESQL_URL
                  optional: true
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: vodi-shiper-env
                  key: POSTGRES_URL
                  optional: true
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vodi-shiper-env
                  key: SECRET_KEY
                  optional: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /ping
              port: http
            failureThreshold: 150
            periodSeconds: 2
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
